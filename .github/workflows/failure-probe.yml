name: failure probe

on:
  push:
    branches: [ci-failure-probe]

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

# Diagnostic only. The full test/check workflows remain the release gates.
# Both revisions use the same hosted image, toolchain, and original assertions.
jobs:
  unit:
    name: focused unit (${{ matrix.label }}, ${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        include:
          - label: baseline
            ref: a53d48db1c15e9d93e37a6574c655cd3c6443dd4
          - label: candidate
            ref: 336ac921ff471d308d31839374eb50ebd0b013b3
        label: [baseline, candidate]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ matrix.ref }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - uses: ./.github/actions/setup-bun
      - name: Record environment
        run: |
          git rev-parse HEAD
          bun --version
          node --version
          uname -a
      - name: Configure git identity
        run: |
          git config --global user.email 'bot@opencode.ai'
          git config --global user.name opencode
      - name: Ripgrep failure cases
        if: runner.os == 'Linux'
        working-directory: packages/core
        run: bun run script/test.ts test/ripgrep.test.ts
        env:
          GITHUB_ACTIONS: 'false'
      - name: Migration generation failure case
        if: always() && runner.os == 'Linux'
        working-directory: packages/core
        run: bun run script/test.ts test/database-migration.test.ts --test-name-pattern 'declared schema has no ungenerated migrations'
        env:
          GITHUB_ACTIONS: 'false'
      - name: PowerShell timeout case
        if: always() && runner.os == 'Linux'
        working-directory: packages/core
        run: >-
          bun run script/test.ts test/tool-shell.test.ts --test-name-pattern 'PowerShell legacy: ordinary syntax reuses approvals'
        env:
          GITHUB_ACTIONS: 'false'
      - name: Promise limit timeout case
        if: always() && runner.os == 'Windows'
        working-directory: packages/codemode
        run: >-
          bun test test/limits.test.ts --test-name-pattern 'promises: too many pending at once'
        env:
          GITHUB_ACTIONS: 'false'
  e2e:
    name: focused e2e (${{ matrix.label }}, linux)
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: baseline
            ref: a53d48db1c15e9d93e37a6574c655cd3c6443dd4
          - label: candidate
            ref: 336ac921ff471d308d31839374eb50ebd0b013b3
    runs-on: ubuntu-latest
    env:
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.playwright-browsers
      CI: true
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ matrix.ref }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.15'
      - uses: ./.github/actions/setup-bun
      - name: Record environment
        run: |
          git rev-parse HEAD
          bun --version
          node --version
          uname -a
      - name: Install Chromium
        working-directory: packages/app
        run: bunx playwright install --with-deps chromium
      - name: Original failed and flaky cases
        working-directory: packages/app
        run: >-
          bun run test:e2e:built
          e2e/regression/new-session-workspace-branch.spec.ts
          e2e/regression/composer-large-paste.spec.ts
          e2e/regression/tab-navigate-mousedown.spec.ts
          e2e/smoke/session-timeline.spec.ts
          --grep 'selects a base branch for a new workspace|keeps a 6000-line crash report editable in a new session|mobile drawer exposes close controls and navigates between tabs|renders seeded timeline in order while paging through history'
        timeout-minutes: 20
      - name: Upload focused traces
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: failure-probe-${{ matrix.label }}-linux
          path: |
            packages/app/e2e/test-results
            packages/app/e2e/playwright-report
          retention-days: 7
