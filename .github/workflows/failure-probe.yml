name: failure probe

on:
  push:
    branches: [ci-failure-probe]

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

# Diagnostic only. The full test/check workflows remain the release gates.
# The initial run compared baseline/candidate; this run verifies the repairs.
jobs:
  e2e:
    name: focused e2e (${{ matrix.label }}, linux)
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: repaired
            ref: 6355a3bc9522ff426a68d7c7ad30f863147bad64
    runs-on: ubuntu-latest
    env:
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.playwright-browsers
      CI: true
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ matrix.ref }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.15'
      - uses: ./.github/actions/setup-bun
      - name: Record environment
        run: |
          git rev-parse HEAD
          bun --version
          node --version
          uname -a
      - name: Install Chromium
        working-directory: packages/app
        run: bunx playwright install --with-deps chromium
      - name: Check App and E2E types
        working-directory: packages/app
        run: |
          bun run typecheck
          bun run typecheck:e2e
      - name: Original failed and flaky cases
        working-directory: packages/app
        run: >-
          bun run test:e2e:built
          e2e/regression/new-session-workspace-branch.spec.ts
          e2e/regression/composer-large-paste.spec.ts
          e2e/regression/tab-navigate-mousedown.spec.ts
          e2e/smoke/session-timeline.spec.ts
          --grep 'selects a base branch for a new workspace|keeps a 6000-line crash report editable in a new session|mobile drawer exposes close controls and navigates between tabs|renders seeded timeline in order while paging through history'
          --repeat-each=5 --retries=0
        timeout-minutes: 20
      - name: Queue regression
        working-directory: packages/app
        run: bun run test:e2e:built e2e/regression/session-queue.spec.ts --retries=0
      - name: Upload focused traces
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: failure-probe-${{ matrix.label }}-linux
          path: |
            packages/app/e2e/test-results
            packages/app/e2e/playwright-report
          retention-days: 7
