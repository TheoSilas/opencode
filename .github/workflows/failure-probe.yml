name: failure probe

on:
  push:
    branches: [ci-failure-probe]

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

# Diagnostic only. The full test/check workflows remain the release gates.
# The initial run compared baseline/candidate; this run verifies the repairs.
jobs:
  e2e:
    name: focused e2e (${{ matrix.label }}, linux)
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: repaired
            ref: d2eddea70ba1bd4902167999d019922a0a8b4565
    runs-on: ubuntu-latest
    env:
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.playwright-browsers
      CI: true
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ matrix.ref }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.15'
      - uses: ./.github/actions/setup-bun
      - name: Record environment
        run: |
          git rev-parse HEAD
          bun --version
          node --version
          uname -a
      - name: Check App and E2E types
        id: types
        working-directory: packages/app
        run: |
          bun run typecheck
          bun run typecheck:e2e
